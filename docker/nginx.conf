server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # SSE: send every event as soon as it is written
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
